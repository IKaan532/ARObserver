services:
  arobserver:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - arobserver_data:/app/data
      - ./targets.yaml:/app/targets.yaml:ro
    restart: unless-stopped

  deepcheck:
    build: ./deepcheck
    restart: unless-stopped

volumes:
  arobserver_data:
    name: arobserver_data
    external: true
